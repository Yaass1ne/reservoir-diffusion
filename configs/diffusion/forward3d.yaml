# Phase 6 (4a) -- 3D forward surrogate: Perm volume -> sat/pressure at sensor times.
# times MUST match configs/diffusion/sensors.yaml.
data:
  data_path: "data/raw/780_c5.h5"
  perm_normalizer: "outputs/diffusion3d/cache3d/normalizer.json"
  obs_fields: ["sat", "pressure"]
  control_fields: ["Rate", "Bhp", "Boundary"]  # injection program (known)
  times: [0, 8, 16, 24, 32, 40, 48]
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42
model:
  base: 32
training:
  epochs: 60
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.00001
  num_workers: 0
  seed: 42
output:
  dir: "outputs/diffusion3d/forward3d"
