# Phase 6 (1) -- 3D autoencoder. latent = latent_ch x 6 x 16 x 16.
data:
  cache_dir: "outputs/diffusion3d/cache3d"
model:
  in_ch: 1
  base: 24
  latent_ch: 8
  down_levels: 2
training:
  epochs: 100
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.00001
  grad_weight: 0.1
  num_workers: 0
  seed: 42
  gate_r2: 0.97
output:
  dir: "outputs/diffusion3d/ae3d"
